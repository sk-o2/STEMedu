services:
  # Backend API service (Express + Socket.io)
  - type: web
    name: stemedu-api
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: cd ../client && npm install && npm run build && cd ../server && npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production

  # Frontend static site (React + Vite)
  - type: web
    name: stemedu-frontend
    env: static
    region: oregon
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
